<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="index.css">
</head>

<body>
  <div id="plant">
    <h1><img id="odin" src="odin-lined.png" alt="Logo"> Odin </h1>
  </div>
  <section class="form-create">
    <div id="label-text">
      <p class="thick">This is not a real online service! You know you need something like this in your life to help you
      realize your deepest dreems.</p>
      <p id="sign-up-now"> Sign up now to get started.</p>
      <p class="yknow">You <em>know</em> you want to.</p>
    </div>
    <form class="input">
      <legend class="thick">Let's do this!</legend>
      <fieldset>
          <label for="firstname">First Name <input id="firstname" type="text" name="firstname" required /></label>
          <label for="lastname">Last Name <input id="lastname" type="text" name="lastname" required /></label>
          <label for="email">Email <input id="email" type="email" name="email" required /></label>
          <label for="phonenumber">Phone Number <input id="phonenumber" type="number" name="phonenumber" requiredmin="0" /></label>
          <label for="password">Password <input id="password" type="password" name="password" required /></label>
          <label for="cpassword">Confirm Password <input id="cpassword" type="password" name="cpassword" required /></label>
      </fieldset>
    </form>
    <div id="create">
      <button id="account">Create Account</button>
    </div>
  </section>
</body>
</html>
